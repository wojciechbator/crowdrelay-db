name: Apply database updates

on:
  push:
    paths:
      - "updates/pending/**"
      - "scripts/apply_pending.py"
      - ".github/workflows/apply-database-updates.yml"
      - ".staging/FINAL_READY"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical database
        uses: actions/checkout@v4

      - name: Materialize staged canonical workbook
        if: ${{ hashFiles('.staging/FINAL_READY') != '' }}
        run: |
          set -e
          test -s .staging/FINAL_READY
          parts=(.staging/final-database.part.*)
          test ${#parts[@]} -gt 0
          cat "${parts[@]}" | base64 -d > database.xlsx
          rm -rf .staging
          echo "Staged canonical workbook materialized."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install openpyxl

      - name: Apply pending research in-place
        run: python scripts/apply_pending.py

      - name: Validate canonical workbook
        run: |
          python3 - <<'PY'
          from collections import Counter
          from openpyxl import load_workbook

          required = {
              "Venues": ["Name","City","Country","Address","Website","Audience_Genre","Capacity","Booking_Contact","Email","Public_Financial_Info","Status","Source_URL","Research_Date","Target_Fit","Contact_Quality","Outreach_Angle","Notes"],
              "Peer Bands": ["Name","Country","City","Genre","Email","Social","Website","Links","Source_URL","Activity","Research_Date","Status","Confidence","Contact_Type","Contact_Source","Outreach_Readiness","Notes"],
              "Beacons": ["Name","Kind","City","Email","Destination_URL","Source_URL","Active","Verified","Accepts_Outreach","Do_Not_Contact","Relationship_Score","Relevance_Pct","Confidence_Pct"],
              "Booking Agents": ["Name","Agency","Email","Roster_URL","Genres","Source_URL","Research_Date","Notes"],
              "Contacts": ["Email","Name","Organization","City","Kind","Phone","Notes","Last_Seen","Disappeared"],
          }

          wb = load_workbook("database.xlsx", read_only=True)
          actual = {}

          def find_header(ws, header):
              for row_no in range(1, min(ws.max_row, 10) + 1):
                  got = [ws.cell(row_no, i + 1).value for i in range(len(header))]
                  if got == header:
                      return row_no
              raise SystemExit(f"{ws.title}: header mismatch")

          def rows_after(ws, header_row):
              for row in ws.iter_rows(min_row=header_row + 1, values_only=True):
                  if any(x not in (None, "") for x in row):
                      yield row

          for sheet, header in required.items():
              ws = wb[sheet]
              hr = find_header(ws, header)
              rows = list(rows_after(ws, hr))
              actual[sheet] = len(rows)
              print(sheet, "header_row=", hr, "rows=", len(rows))

              sigs = [tuple("" if x is None else str(x).strip().casefold() for x in r) for r in rows]
              if len(sigs) != len(set(sigs)):
                  raise SystemExit(f"{sheet}: exact duplicate rows detected")

              if sheet in ("Venues", "Peer Bands", "Booking Agents"):
                  if any(not str(r[0] or "").strip() for r in rows):
                      raise SystemExit(f"{sheet}: empty Name found")

          minimums = {
              "Venues": 92,
              "Peer Bands": 1065,
              "Beacons": 1084,
              "Booking Agents": 11,
              "Contacts": 909,
          }
          for sheet, minimum in minimums.items():
              if actual[sheet] < minimum:
                  raise SystemExit(f"{sheet} regressed: {actual[sheet]} < {minimum}")

          allowed = {"Poland", "Germany", "Czechia", "Slovakia"}
          ws = wb["Peer Bands"]; hr = find_header(ws, required["Peer Bands"]); rows = list(rows_after(ws, hr))
          # During the 100-row migration batches, legacy records may still be pending cleanup.
          # Validate only that the workbook remains structurally sound and that no invalid country
          # values are introduced. Strict all-active validation is performed after the final batch.
          for r in rows:
              country = str(r[1] or "").strip()
              if country and country not in allowed:
                  raise SystemExit(f"Peer Bands: invalid country {country!r} for {r[0]!r}")

          ws = wb["Venues"]; hr = find_header(ws, required["Venues"]); rows = list(rows_after(ws, hr))
          for r in rows:
              if str(r[2] or "").strip() not in allowed:
                  raise SystemExit(f"Venues: invalid/missing country for {r[0]!r}")
              if str(r[10] or "").strip().casefold() != "active":
                  raise SystemExit(f"Venues: non-active record remains: {r[0]!r}")
              if not str(r[11] or "").strip() or not str(r[12] or "").strip():
                  raise SystemExit(f"Venues: missing source/research date for {r[0]!r}")

          invalid_venue_names = {"sanity check tour", "seiðr 2026", "pole festiwalowe zakręć śmigłem"}
          for r in rows:
              if str(r[0] or "").strip().casefold() in invalid_venue_names:
                  raise SystemExit(f"Invalid venue record remains: {r[0]!r}")

          print("FINAL_DATABASE_QA_OK", actual)
          PY

      - name: Commit canonical workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database.xlsx updates/applied
          if git diff --cached --quiet; then
            echo "No database changes."
            exit 0
          fi
          git commit -m "chore: apply Virya database updates"
          git push
