name: Apply database updates

on:
  push:
    paths:
      - "database.xlsx"
      - "updates/pending/**"
      - "scripts/apply_pending.py"
      - ".github/workflows/apply-database-updates.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install openpyxl

      - name: Apply pending research
        run: python scripts/apply_pending.py

      - name: Commit applied database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database.xlsx updates/applied
          if git diff --cached --quiet; then
            echo "No database changes."
            exit 0
          fi
          git commit -m "chore: apply Virya database updates"
          git push
