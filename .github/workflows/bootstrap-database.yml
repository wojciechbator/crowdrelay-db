name: Bootstrap canonical database

on:
  push:
    paths:
      - "snapshot/**"
      - "scripts/rebuild_from_snapshot.py"
      - ".github/workflows/bootstrap-database.yml"

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install openpyxl

      - name: Rebuild from canonical snapshot
        run: python scripts/rebuild_from_snapshot.py

      - name: Apply pending research deltas
        run: python scripts/apply_pending.py

      - name: Validate workbook
        run: |
          python3 - <<'PY'
          from openpyxl import load_workbook
          wb = load_workbook("database.xlsx", read_only=True)
          required = {
              "Venues": ["Name","City","Country","Address","Website","Audience_Genre","Capacity","Booking_Contact","Email","Public_Financial_Info","Status","Source_URL","Research_Date","Target_Fit","Contact_Quality","Outreach_Angle","Notes"],
              "Booking Agents": ["Name","Agency","Email","Roster_URL","Genres","Source_URL","Research_Date","Notes"],
              "Peer Bands": ["Name","Country","City","Genre","Email","Social","Website","Links","Source_URL","Activity","Research_Date","Status","Confidence","Contact_Type","Contact_Source","Outreach_Readiness","Notes"],
          }
          for sheet, header in required.items():
              ws = wb[sheet]
              got = [ws.cell(1, i + 1).value for i in range(len(header))]
              if got != header:
                  raise SystemExit(f"{sheet} header mismatch: {got}")
              print(sheet, "rows=", ws.max_row - 1)
          PY

      - name: Commit canonical workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database.xlsx updates/applied
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: bootstrap canonical Virya database"
          git push
