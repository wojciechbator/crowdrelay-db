name: Daily city micro-pass

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/city_micro_pass.py"
      - "scripts/city_micro_pass_runner.py"
      - ".github/workflows/daily-city-micro-pass.yml"
  schedule:
    - cron: "30 6 * * *"

concurrency:
  group: crowdrelay-city-micro-pass
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  city-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CITY_BATCH_SIZE: "4"
      CITY_CANDIDATE_WINDOW: "12"
      CITY_MIN_RAW_RESULTS: "4"
      CITY_MIN_DIRECT_LEADS: "3"
      CITY_MIN_USEFUL_LEADS: "4"
      CITY_MIN_SOURCE_FAMILIES: "3"
      CITY_MIN_SOCIAL_FAMILIES: "1"
      CITY_MIN_MEDIA_FAMILIES: "0"
      CITY_MIN_SOURCE_CATEGORIES: "3"
      CITY_PASS_TIME_BUDGET: "1800"
      CITY_MAX_NOISE_RATE: "0.35"
    steps:
      - name: Checkout canonical database
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install openpyxl requests beautifulsoup4

      - name: Smoke test city research code
        run: |
          python -m py_compile scripts/city_micro_pass.py scripts/city_micro_pass_runner.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("city_micro_pass", Path("scripts/city_micro_pass.py"))
          if spec is None or spec.loader is None:
              raise SystemExit("Could not load city_micro_pass.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          empty = {
              "peers": [],
              "beacons": [],
              "contacts": [],
              "raw_results": 0,
              "direct_leads": 0,
              "useful": 0,
              "source_families": [],
              "social_families": [],
              "media_families": [],
              "evidence_urls": [],
          }
          merged = module.merge_discovery(empty, empty)
          assert merged["raw_results"] == 0
          assert merged["direct_leads"] == 0
          assert merged["useful"] == 0
          assert not merged["source_families"]

          queue = module.all_cities(load_workbook("database.xlsx", read_only=True))
          assert len(queue) >= 31, len(queue)
          assert ("Gdańsk", "Poland") in queue
          assert ("Dortmund", "Germany") in queue
          assert ("Liberec", "Czechia") in queue
          assert ("Košice", "Slovakia") in queue
          print("CITY_QUEUE_SMOKE_OK", len(queue), queue[:4])

          import os
          good = {
              "raw_results": int(os.environ["CITY_MIN_RAW_RESULTS"]),
              "direct_leads": int(os.environ["CITY_MIN_DIRECT_LEADS"]),
              "useful": int(os.environ["CITY_MIN_USEFUL_LEADS"]),
              "source_families": ["a"] * int(os.environ["CITY_MIN_SOURCE_FAMILIES"]),
              "social_families": ["facebook_groups"],
              "media_families": ["local_press"],
              "source_categories": ["ecosystem", "media", "social"],
          }
          assert module.result_quality_ok(good), good
          weak = dict(good)
          weak["source_categories"] = ["social", "media"]
          assert not module.result_quality_ok(weak), weak
          assert not module.usable_direct_url("https://www.facebook.com/reg/")
          assert not module.usable_direct_url("https://www.youtube.com/watch?v=abc")
          assert not module.beacon_candidate_ok(
              "Radio Eska łódź Na Żywo Za Darmo | FM-RADIO.live",
              "independent_radio",
              "https://fm-radio.live/",
              "Łódź FM-RADIO live radio",
              allow_non_direct=True,
              country="Poland",
              city="Łódź",
          )
          assert not module.beacon_candidate_ok(
              "Best Polisher Podcasts (2025)",
              "podcast",
              "https://player.fm/",
              "Łódź podcast music",
              allow_non_direct=True,
              country="Poland",
              city="Łódź",
          )
          queries = module.city_queries("Bydgoszcz", "Poland")
          kinds = [kind for kind, _ in queries]
          required = {"bands", "facebook_groups", "facebook_pages", "instagram", "youtube", "local_press", "events", "radio", "culture", "promoters"}
          assert required.issubset(set(kinds)), sorted(set(kinds))
          assert len(queries) <= 12, len(queries)
          recovery = module.city_queries("Bydgoszcz", "Poland", recovery=True)
          recovery_kinds = {kind for kind, _ in recovery}
          assert {"facebook_groups", "facebook_pages", "instagram", "local_press", "radio", "events", "culture", "promoters"}.issubset(recovery_kinds)
          print("CITY_PASS_SMOKE_OK", len(queries), len(recovery))
          PY

      - name: Research next four eligible cities
        run: |
          set -o pipefail
          python scripts/city_micro_pass_runner.py 2>&1 | tee /tmp/city-pass.log
          if grep -q '^CITY_PASS_DONE no eligible unprocessed cities' /tmp/city-pass.log; then
            echo "CITY_PASS_NO_ELIGIBLE=true" >> "$GITHUB_ENV"
          else
            echo "CITY_PASS_NO_ELIGIBLE=false" >> "$GITHUB_ENV"
          fi

      - name: Validate city pass
        run: |
          if [ "$CITY_PASS_NO_ELIGIBLE" = "true" ]; then
            echo "CITY_PASS_EMPTY_OK no eligible unprocessed cities remain."
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          files = sorted(Path("city_passes").glob("*.json"))
          if not files:
              print("No eligible cities left.")
              raise SystemExit(0)
          payload = json.loads(files[-1].read_text(encoding="utf-8"))
          if payload.get("no_progress") or not payload.get("cities"):
              raise SystemExit(
                  "CITY_PASS_NO_PROGRESS: latest research pass did not qualify any city"
              )
          if payload.get("batch_complete") is False:
              # Partial batches are real progress: qualified cities are kept and
              # rejected ones stay eligible for the next run.
              print(
                  f"CITY_PASS_PARTIAL qualified={len(payload['cities'])} "
                  f"requested={payload.get('batch_size_requested')} "
                  f"rejected={len(payload.get('rejected_candidates', []))}"
              )
          if payload.get("date") != __import__("datetime").date.today().isoformat():
              raise SystemExit("Latest city pass is stale; refusing false-positive validation")
          cities = payload.get("cities", [])
          if len(cities) > 4:
              raise SystemExit(f"City batch too large: {len(cities)} > 4")
          for city in cities:
              if city.get("country") not in {"Poland", "Germany", "Czechia", "Slovakia"}:
                  raise SystemExit(f"Unexpected country: {city}")
              if not city.get("city"):
                  raise SystemExit(f"Missing city: {city}")
          summaries = payload.get("summary", [])
          if len(summaries) != len(cities):
              raise SystemExit("Summary/city count mismatch")
          floors = {
              "raw_results": int(os.environ["CITY_MIN_RAW_RESULTS"]),
              "direct_leads": int(os.environ["CITY_MIN_DIRECT_LEADS"]),
              "useful": int(os.environ["CITY_MIN_USEFUL_LEADS"]),
          }
          for summary in summaries:
              if not summary.get("quality_ok"):
                  raise SystemExit(f"{summary.get('city')}: quality_ok=false")
              for field, minimum in floors.items():
                  if int(summary.get(field, 0) or 0) < minimum:
                      raise SystemExit(f"{summary.get('city')}: {field} below QA floor")
              if len(summary.get("source_families", [])) < int(os.environ["CITY_MIN_SOURCE_FAMILIES"]):
                  raise SystemExit(f"{summary.get('city')}: too few source families")
              if not summary.get("social_families"):
                  raise SystemExit(f"{summary.get('city')}: no social/community source")
              if len(summary.get("source_categories", [])) < int(os.environ["CITY_MIN_SOURCE_CATEGORIES"]):
                  raise SystemExit(f"{summary.get('city')}: too few source categories")
          print("CITY_PASS_QA_OK", cities)
          PY

      - name: Commit city research queue and pending updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # updates/pending is empty when no city qualified — a missing
          # pathspec fails `git add` and loses the pass queue entirely.
          git add -A city_passes updates/
          if git diff --cached --quiet; then
            echo "No city research changes."
            exit 0
          fi
          git commit -m "research: daily city micro-pass"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push race detected; rebasing onto latest main (attempt ${attempt})."
            git pull --rebase origin main
          done
          echo "Failed to push city research after 3 attempts."
          exit 1
