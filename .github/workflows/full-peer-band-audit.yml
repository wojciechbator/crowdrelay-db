name: Full peer band audit

on:
  workflow_dispatch:

concurrency:
  group: peer-band-full-audit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical database
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install openpyxl requests beautifulsoup4

      - name: Run full row-by-row peer audit
        env:
          APPLY_AUDIT: "0"
        run: python scripts/full_audit.py

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: peer-band-audit
          path: |
            audit/peer_bands_audit__*.csv
            audit/peer_bands_audit_summary__*.json

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit
          if git diff --cached --quiet; then
            echo "No audit report changes."
            exit 0
          fi
          git commit -m "chore: audit peer band database"
          git push
