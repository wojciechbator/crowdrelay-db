name: Full peer band audit

on:
  workflow_dispatch:

concurrency:
  group: peer-band-full-audit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout canonical database
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install openpyxl requests beautifulsoup4

      - name: Run full row-by-row peer audit
        env:
          APPLY_AUDIT: "1"
          AUDIT_BATCH_SIZE: "10"
        run: python scripts/full_audit.py

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: peer-band-audit
          path: |
            audit/peer_bands_audit__*.csv
            audit/peer_bands_audit_summary__*.json

      - name: Validate 10-row batch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv
          reports = sorted(Path("audit").glob("peer_bands_audit_batch__*.csv"))
          report = reports[-1]
          with report.open(encoding="utf-8", newline="") as fh:
              rows = list(csv.DictReader(fh))
          if len(rows) > 10:
              raise SystemExit(f"Batch too large: {len(rows)} > 10")
          print("BATCH_QA_OK", report.name, len(rows))
          PY

      - name: Commit 10-row batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push -u -m "pre-audit-rebase" || true
          git pull --rebase origin main
          git stash pop || true
          git add database.xlsx audit
          if git diff --cached --quiet; then
            echo "No audit batch changes."
            exit 0
          fi
          git commit -m "chore: audit next 10 peer bands"
          git push
