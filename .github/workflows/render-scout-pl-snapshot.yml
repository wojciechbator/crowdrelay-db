name: Merge SCOUT into canonical database

on:
  workflow_dispatch:
  push:
    paths:
      - "scout_runs/current.json"
      - "scripts/merge_festival_snapshot.py"
      - "scripts/validate_scout_snapshot.py"
      - ".github/workflows/render-scout-pl-snapshot.yml"

concurrency:
  group: crowdrelay-database-apply
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical database
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install openpyxl

      - name: Merge current Scout delta into database.xlsx
        run: python scripts/merge_festival_snapshot.py

      - name: Validate merged workbook
        run: python scripts/validate_scout_snapshot.py

      - name: Commit unified database workbook
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database.xlsx
          if git diff --cached --quiet; then
            echo "No workbook change."
            exit 0
          fi
          git commit -m "chore: merge SCOUT into database.xlsx"
          for _ in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase
            git add database.xlsx
            git commit --amend --no-edit
          done
          exit 1
