name: Render SCOUT_PL snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - "scout_runs/current.json"
      - "scripts/render_scout_snapshot.py"
      - ".github/workflows/render-scout-pl-snapshot.yml"

concurrency:
  group: crowdrelay-scout-pl-render
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render binary snapshot
        run: python scripts/render_scout_snapshot.py
      - name: Verify XLSX package integrity
        run: unzip -t database_festivals.xlsx
      - name: Validate rendered snapshot
        run: python scripts/validate_scout_snapshot.py
      - name: Commit rendered snapshot
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database_festivals.xlsx
          if git diff --cached --quiet; then echo "No snapshot change."; exit 0; fi
          git commit -m "chore: render SCOUT_PL snapshot"
          for _ in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push race detected; rebasing snapshot render."
            git pull --rebase origin main
            git add database_festivals.xlsx
            git commit --amend --no-edit
          done
          exit 1