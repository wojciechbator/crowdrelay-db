name: Validate unified SCOUT database

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Merge SCOUT into canonical database"]
    types: [completed]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install openpyxl
      - name: Validate unified database.xlsx
        run: python scripts/validate_scout_snapshot.py
